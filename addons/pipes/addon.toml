name = "pipes"
description = "pipes.sh that keeps the wallpaper palette after its screen reset (use `wallflow-pipes` instead of `pipes.sh`)"
requires = ["pipes.sh"]
bin = "wallflow-pipes"
note = "Run `wallflow-pipes [seconds] [pipes.sh args]` instead of `pipes.sh` (e.g. in your Hyprland autostart). pipes.sh's own reset does a terminal RIS, which drops foot back to its startup palette; the wrapper disables that and restarts pipes.sh every N seconds (default 300) with the current colours."
