name = "pipes"
description = "pipes.sh keeps the wallpaper palette after its screen reset (drop-in, no config change)"
requires = ["pipes.sh"]
bin = "pipes.sh"
note = "Installs a wrapper as ~/.local/bin/pipes.sh that shadows the real one (make sure ~/.local/bin is first in PATH). It disables pipes.sh's own reset (RIS drops foot to its startup palette) and restarts it every $WALLFLOW_PIPES_INTERVAL seconds (default 300) with the current colours. Restart running pipes.sh windows once."
